<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Nail Preference Study</title>

  <style>
    :root {
      --bg: #f7f1ec;
      --card: #ffffff;
      --text: #3b2f2f;
      --muted: #7b6b63;
      --main: #3b2f2f;
      --sub: #d8c3b5;
      --accent: #b98572;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .app {
      max-width: 1040px;
      margin: 0 auto;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 18px;
    }

    h1 {
      font-size: 24px;
      margin: 8px 0;
    }

    .subtitle {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.6;
    }

    .panel {
      background: rgba(255, 255, 255, 0.75);
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 18px;
      box-shadow: 0 8px 24px rgba(80, 50, 30, 0.08);
    }

    .consent {
      max-width: 720px;
      margin: 40px auto;
      background: white;
      padding: 28px;
      border-radius: 24px;
      box-shadow: 0 12px 32px rgba(80, 50, 30, 0.12);
    }

    .consent h2 {
      margin-top: 0;
    }

    .consent p {
      line-height: 1.8;
      color: var(--muted);
    }

    .progress {
      text-align: center;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .progress-bar {
      width: 100%;
      height: 10px;
      background: #eaded6;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--main);
      border-radius: 999px;
      transition: width 0.2s ease;
    }

    .pair-area {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      align-items: stretch;
    }

    .card {
      background: var(--card);
      border-radius: 24px;
      padding: 12px;
      box-shadow: 0 8px 24px rgba(80, 50, 30, 0.12);
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, outline 0.15s ease;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      outline: 3px solid transparent;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 30px rgba(80, 50, 30, 0.18);
    }

    .card:active {
      transform: scale(0.98);
    }

    .card img {
      width: 100%;
      border-radius: 18px;
      display: block;
      background: #eee;
      aspect-ratio: 1 / 1;
      object-fit: cover;
    }

    .card-label {
      margin-top: 10px;
      font-size: 13px;
      text-align: center;
      color: var(--muted);
      word-break: break-all;
    }

    .choice-label {
      text-align: center;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--accent);
    }

    .controls {
      margin-top: 20px;
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 12px 18px;
      font-size: 14px;
      cursor: pointer;
      background: var(--main);
      color: white;
      transition: transform 0.12s ease, opacity 0.12s ease;
    }

    button:hover {
      opacity: 0.92;
    }

    button:active {
      transform: scale(0.98);
    }

    button.secondary {
      background: var(--sub);
      color: var(--text);
    }

    button.light {
      background: white;
      color: var(--text);
      border: 1px solid #e4d5cc;
    }

    .done {
      text-align: center;
      background: white;
      padding: 32px;
      border-radius: 24px;
      box-shadow: 0 8px 24px rgba(80, 50, 30, 0.12);
      margin-top: 30px;
    }

    .meta {
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      margin-top: 10px;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 760px) {
      .app {
        padding: 14px;
      }

      h1 {
        font-size: 20px;
      }

      .pair-area {
        grid-template-columns: 1fr;
      }

      .card img {
        aspect-ratio: 1 / 1;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <div class="app">

    <div id="consentView" class="consent">
      <h2>ネイル画像の好み調査</h2>
      <p>
        これから2枚のネイル画像を比較して、より好きだと感じる方を選んでください。
        回答には、選択内容と反応時間が記録されます。
      </p>
      <p>
        「どちらも好き」「どちらも微妙」「迷う」も選べます。
        直感で回答して大丈夫です。
      </p>
      <button id="startButton">開始する</button>
    </div>

    <div id="mainView" class="hidden">
      <header>
        <h1>どっちのネイルが好き？</h1>
        <div class="subtitle">
          直感で好きな方をタッチしてください
        </div>
      </header>

      <div class="panel">
        <div class="progress" id="progressText">読み込み中...</div>
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="meta" id="sessionInfo"></div>
      </div>

      <div class="pair-area">
        <div class="card" id="leftCard">
          <div class="choice-label">LEFT</div>
          <img id="leftImage" src="" alt="left image">
          <div class="card-label" id="leftFileName"></div>
        </div>

        <div class="card" id="rightCard">
          <div class="choice-label">RIGHT</div>
          <img id="rightImage" src="" alt="right image">
          <div class="card-label" id="rightFileName"></div>
        </div>
      </div>

      <div class="controls">
        <button class="secondary" id="bothLikeButton">どちらも好き</button>
        <button class="secondary" id="bothDislikeButton">どちらも微妙</button>
        <button class="light" id="unsureButton">迷う</button>
        <button class="light" id="skipButton">スキップ</button>
      </div>

      <div class="controls">
        <button id="downloadButton">結果CSVをダウンロード</button>
      </div>
    </div>

    <div id="doneView" class="done hidden">
      <h2>完了！</h2>
      <p>すべてのペアを評価しました。</p>
      <button id="downloadButtonDone">結果CSVをダウンロード</button>
    </div>

  </div>

  <script>
    const API_BASE = "https://makeup-enz8.onrender.com";

    let pairs = [];
    let currentIndex = 0;
    let pairStartTime = null;
    let totalPairsAtStart = 0;

    let userId = localStorage.getItem("nail_choice_user_id");
    if (!userId) {
      userId = crypto.randomUUID();
      localStorage.setItem("nail_choice_user_id", userId);
    }

    const sessionId = crypto.randomUUID();

    const consentView = document.getElementById("consentView");
    const mainView = document.getElementById("mainView");
    const doneView = document.getElementById("doneView");

    const startButton = document.getElementById("startButton");

    const progressText = document.getElementById("progressText");
    const progressFill = document.getElementById("progressFill");
    const sessionInfo = document.getElementById("sessionInfo");

    const leftCard = document.getElementById("leftCard");
    const rightCard = document.getElementById("rightCard");

    const leftImage = document.getElementById("leftImage");
    const rightImage = document.getElementById("rightImage");

    const leftFileName = document.getElementById("leftFileName");
    const rightFileName = document.getElementById("rightFileName");

    const bothLikeButton = document.getElementById("bothLikeButton");
    const bothDislikeButton = document.getElementById("bothDislikeButton");
    const unsureButton = document.getElementById("unsureButton");
    const skipButton = document.getElementById("skipButton");

    const downloadButton = document.getElementById("downloadButton");
    const downloadButtonDone = document.getElementById("downloadButtonDone");

    async function loadPairs() {
      const url = `${API_BASE}/api/pairs?user_id=${encodeURIComponent(userId)}`;

      const res = await fetch(url);

      if (!res.ok) {
        let message = "";

        try {
          const errorData = await res.json();
          message = JSON.stringify(errorData, null, 2);
        } catch (e) {
          message = await res.text();
        }

        alert(
          "ペアデータの読み込みに失敗しました\n\n" +
          "status: " + res.status + "\n" +
          "url: " + url + "\n\n" +
          message
        );

        return;
      }

      const data = await res.json();

      pairs = data.pairs;
      currentIndex = 0;
      totalPairsAtStart = pairs.length;

      showCurrentPair();
    }

    function showCurrentPair() {
      if (currentIndex >= pairs.length) {
        mainView.classList.add("hidden");
        doneView.classList.remove("hidden");
        return;
      }

      const pair = pairs[currentIndex];

      leftImage.src = API_BASE + pair.left_image_url;
      rightImage.src = API_BASE + pair.right_image_url;

      leftFileName.textContent = pair.left_file;
      rightFileName.textContent = pair.right_file;

      const doneCount = currentIndex;
      const total = pairs.length;
      const percent = total === 0 ? 100 : (doneCount / total) * 100;

      progressText.textContent = `${currentIndex + 1} / ${pairs.length}`;
      progressFill.style.width = `${percent}%`;

      sessionInfo.textContent =
        `user_id: ${userId.slice(0, 8)}... / session_id: ${sessionId.slice(0, 8)}...`;

      pairStartTime = performance.now();
    }

    async function submitChoice(choiceType) {
      if (currentIndex >= pairs.length) return;

      const pair = pairs[currentIndex];

      const reactionTimeMs = Math.round(performance.now() - pairStartTime);

      const payload = {
        user_id: userId,
        session_id: sessionId,
        pair_id: pair.pair_id,
        left_file: pair.left_file,
        right_file: pair.right_file,
        choice_type: choiceType,
        reaction_time_ms: reactionTimeMs
      };

      const res = await fetch(`${API_BASE}/api/choice`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(payload)
      });

      if (!res.ok) {
        let message = "";

        try {
          const errorData = await res.json();
          message = JSON.stringify(errorData, null, 2);
        } catch (e) {
          message = await res.text();
        }

        alert(
          "保存に失敗しました\n\n" +
          "status: " + res.status + "\n\n" +
          message
        );

        return;
      }

      currentIndex += 1;

      if (currentIndex >= pairs.length) {
        progressFill.style.width = "100%";
      }

      showCurrentPair();
    }

    function downloadResults() {
      window.location.href = `${API_BASE}/api/results/download`;
    }

    startButton.addEventListener("click", async () => {
      consentView.classList.add("hidden");
      mainView.classList.remove("hidden");
      await loadPairs();
    });

    leftCard.addEventListener("click", () => submitChoice("left"));
    rightCard.addEventListener("click", () => submitChoice("right"));

    bothLikeButton.addEventListener("click", () => submitChoice("both_like"));
    bothDislikeButton.addEventListener("click", () => submitChoice("both_dislike"));
    unsureButton.addEventListener("click", () => submitChoice("unsure"));
    skipButton.addEventListener("click", () => submitChoice("skip"));

    downloadButton.addEventListener("click", downloadResults);
    downloadButtonDone.addEventListener("click", downloadResults);
  </script>
</body>
</html>
